name: Build KING REIGNS WORD BUILDER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Kivy Buildozer
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build APK with Full Log
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee build-full.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KING-REIGNS-BUILD-LOG
          path: build-full.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KING-REIGNS-WORD-BUILDER-APK
          path: bin/*.apk
