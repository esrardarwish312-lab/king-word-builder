name: Build KING REIGNS WORD BUILDER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Kivy Buildozer
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-REIGNS-WORD-BUILDER-APK
          path: bin/*.apk
